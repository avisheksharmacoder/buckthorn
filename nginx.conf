# nginx.conf
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    server_tokens      off;

    # Match Buckthorn's 15-second uv_timer_t idle timeout
    keepalive_timeout  15s;
    keepalive_requests 10000;

    # Map Upgrade header so standard HTTP/1.1 requests keep empty Connection header
    # (preserving upstream keepalive), while WebSocket handshakes send "upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    upstream buckthorn_backend {
        # Connect to Buckthorn's SO_REUSEPORT listener
        server buckthorn:8000 max_fails=0;

        # Maintain warm persistent TCP sockets to libuv workers
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 12s;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.example.com localhost;

        # Match Buckthorn's default max_body_size (1MB) and buffer in RAM
        client_max_body_size 1m;
        client_body_buffer_size 64k;
        client_header_buffer_size 4k;
        large_client_header_buffers 4 8k;

        # Critical for bt_audit.c: Nginx buffers slow/chunked client uploads and
        # forwards a single HTTP/1.1 request with an exact Content-Length header.
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        location / {
            proxy_pass http://buckthorn_backend;
            proxy_http_version 1.1;

            # Pass validated Host header for bt_middleware.c TrustedHostMiddleware
            proxy_set_header Host $host;

            # Overwrite X-Forwarded-For with the true TCP peer IP so clients cannot
            # spoof headers to bypass bt_middleware.c FNV-1a rate-limiting buckets.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Reuse upstream keepalive connections or upgrade to RFC 6455 WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 2s;
            proxy_send_timeout    15s;
            proxy_read_timeout    60s;
        }
    }
}
