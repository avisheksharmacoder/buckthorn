[build-system]
requires = ["setuptools>=68.0", "Cython>=3.0.10", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buckthorn"
version = "1.1.0"
description = "High-Performance Python Web Framework Powered by C99, Cython, and SIMD Hardware Acceleration."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Avishek Sharma" }]
requires-python = ">=3.11"
dependencies = [
    "Cython>=3.0.10",
    "setuptools>=68.0",
    "uvloop>=0.21.0",
]

[project.scripts]
buckthorn = "buckthorn.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]
