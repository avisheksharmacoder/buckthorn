[build-system]
requires = ["setuptools>=68.0", "Cython>=3.0.10", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buckthorn"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "Cython>=3.0.10",
    "setuptools>=68.0",
]

[project.scripts]
buckthorn = "buckthorn.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]
